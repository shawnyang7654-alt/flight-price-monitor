name: Flight Price Monitor

on:
  schedule:
    # 每天 01:00 / 07:00 / 13:00 / 19:00 UTC（北京时间 09/15/21/03 点）
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch:
    inputs:
      from_code:
        description: '出发地三字码'
        required: true
        default: 'SHA'
      from_name:
        description: '出发地名称'
        required: true
        default: '上海'
      to_code:
        description: '目的地三字码'
        required: true
        default: 'IST'
      to_name:
        description: '目的地名称'
        required: true
        default: '伊斯坦布尔'
      depart_date:
        description: '去程日期 (YYYY-MM-DD)'
        required: true
        default: '2027-09-30'
      return_date:
        description: '返程日期 (YYYY-MM-DD)'
        required: true
        default: '2027-10-10'
      threshold:
        description: '往返总价提醒阈值（元）'
        required: true
        default: '8000'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps

      - name: Run Ctrip round-trip total fare monitor
        run: |
          python scripts/ctrip_roundtrip.py \
            --from-code "${{ github.event.inputs.from_code || 'SHA' }}" \
            --from-name "${{ github.event.inputs.from_name || '上海' }}" \
            --to-code "${{ github.event.inputs.to_code || 'IST' }}" \
            --to-name "${{ github.event.inputs.to_name || '伊斯坦布尔' }}" \
            --depart-date "${{ github.event.inputs.depart_date || '2027-09-30' }}" \
            --return-date "${{ github.event.inputs.return_date || '2027-10-10' }}" \
            --threshold "${{ github.event.inputs.threshold || '8000' }}" \
            --serverchan-key "${{ secrets.SERVERCHAN_KEY }}"
        timeout-minutes: 15

      - name: Commit round-trip monitor data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update round-trip fare data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
